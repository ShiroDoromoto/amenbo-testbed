name: kakeibo CI

on:
  push:
    branches: [master]
    paths:
      - 'kakeibo/**'
      - '.github/workflows/kakeibo-ci.yml'
  pull_request:
    paths:
      - 'kakeibo/**'
      - '.github/workflows/kakeibo-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kakeibo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kakeibo/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
